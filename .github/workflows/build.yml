name: build

# Every pull request and push to main builds and tests jdoc, assembles the release bundle, installs it into temporary
# directories and smoke-tests the installed launcher offline. A v* tag also publishes a GitHub release with the
# tarball, SHA256SUMS and signed build provenance.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Tools (shellcheck, dash, mvn)
        run: |
          if ! command -v shellcheck > /dev/null || ! command -v dash > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends shellcheck dash
          fi
          shellcheck --version | head -2
          java -version
          mvn -v | head -1

      - name: Version from tag, else snapshot
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # CI=true (set by Actions) makes a missing test prerequisite fail instead of skip: InstallerIT runs shellcheck
      # on dist/install.sh, dist/bin/jdoc and scripts/*.sh, RealMavenResolutionIT runs the Maven of this build offline.
      - name: Build and test
        run: ./mvnw -B -ntp -Drevision="$VERSION" verify

      - name: Assemble bundle
        run: scripts/assemble.sh "$VERSION"

      - name: Install check and offline smoke test (launcher under dash)
        env:
          INSTALL_TEST_REQUIRE_DASH: '1'
        run: scripts/install-test.sh "out/jdoc-$VERSION.tar.gz" it/sample-project

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jdoc-${{ env.VERSION }}
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/jdoc-*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes "${prerelease[@]}" \
            -R "$GITHUB_REPOSITORY"
